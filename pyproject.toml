[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwoom-sector-board"
version = "0.1.0"
description = "Kiwoom sector board Streamlit app with reusable Flask sector_board package."
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1.0",
  "SQLAlchemy>=2.0.38",
  "psycopg[binary]>=3.2.0",
  "pandas>=2.2.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "finance-datareader>=0.9.50",
  "APScheduler>=3.10.0",
  "pytz>=2024.1",
]

[tool.setuptools]
packages = ["sector_board", "src"]

[tool.setuptools.package-data]
sector_board = [
  "templates/sector_board/*.html",
  "static/*.css",
]
src = [
  "data/*.csv",
]
